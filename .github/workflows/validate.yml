name: Validate challenge repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-challenges-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      container_matrix: ${{ steps.container_matrix.outputs.matrix }}
      container_count: ${{ steps.container_matrix.outputs.count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            challenges/AD/Pwn/attack-defense-service/checker/requirements.txt
            challenges/AD/Web/self-hosted-service/checker/requirements.txt

      - name: Validate manifests with rsctf
        uses: dimasma0305/rsctf@main

      - name: Validate repository conventions and compile Python examples
        run: make validate

      - name: Discover container build contexts
        id: container_matrix
        run: |
          python3 scripts/container-images.py check
          python3 scripts/container-images.py github-output >> "$GITHUB_OUTPUT"

      - name: Install pinned checker wheels
        run: |
          python3 -m venv .checker-venv
          .checker-venv/bin/python -m pip install \
            --disable-pip-version-check \
            --no-input \
            --only-binary=:all: \
            -- \
            pwntools==4.15.0 \
            httpx==0.28.1

      - name: Exercise checker verdicts
        run: .checker-venv/bin/python scripts/test-checkers.py

      - name: Exercise signed KotH observer
        run: python3 scripts/test-koth-observer.py

      - name: Exercise deterministic provenance generator
        run: python3 scripts/test-provenance.py

      - name: Exercise provenance automation clients
        run: node scripts/test-provenance-automation.mjs

      - name: Exercise dynamic container discovery
        run: python3 scripts/test-container-discovery.py

      - name: Exercise additive catalog validation
        run: node scripts/test-catalog-extension.mjs

  containers:
    name: Build ${{ matrix.name }}
    needs: manifests
    if: needs.manifests.outputs.container_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifests.outputs.container_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build without pushing
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          push: false
          tags: rsctf-example/${{ matrix.tag }}:ci
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

      - name: Verify image health and behavior
        if: matrix.smoke != ''
        run: >-
          python3 scripts/test-container-images.py
          --image rsctf-example/${{ matrix.tag }}:ci
          --case ${{ matrix.smoke }}
