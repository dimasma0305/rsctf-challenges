# This shared hill demonstrates RSCTF's signed Leaderboard referee. The referee is
# deployed separately; its HMAC secret must never enter this challenge image.
name: "King of the Hill Demo: Proof Arena"
author: "rsctf documentation team"
description: |
  This is a Leaderboard hill, not an exclusive boot2root hill. Every team can
  score during the same tick.

  POST your current KotH token as JSON to `/start`. The response contains a
  one-use nonce. Find a counter whose SHA-256 digest of
  `nonce + ":" + counter` begins with four zero hexadecimal digits, then POST
  `{"sessionId":"...","counter":123}` to `/solve` before it expires.

  RSCTF independently normalizes verified activity plus the stable
  `proof-strength` and `solve-speed` objectives. A four-zero proof is valid; finding a
  fifth leading zero improves strength but takes time, so the two objective
  channels create a real trade-off. Solving repeatedly matters; failed guesses
  do not award evidence or subtract points. Consistent first place earns a
  bounded continuity bonus. The external referee sends evidence, never points
  or raw bearer tokens.
type: KingOfTheHill
category: Web
disableBloodBonus: true

container:
  # Repository Bindings builds only ./src. The sibling observer/ directory and
  # its runtime secret are deliberately outside the attackable hill image.
  memoryLimit: 64
  cpuCount: 1
  exposePort: 8080

ad:
  allowEgress: false
