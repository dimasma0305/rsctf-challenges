# Each accepted participation receives immutable generated content and a flag.
# Repository Bindings auto-builds the adjacent generator/Dockerfile.
name: "Deterministic Variant: Team Sum"
author: "rsctf documentation team"
description: |
  The question shown here is replaced by a deterministic team-specific sum
  before the event starts. Follow the generated instructions and submit the
  resulting flag.
type: StaticAttachment
category: Misc
minScoreRate: 0.25
difficulty: 5
submissionLimit: 10
disableBloodBonus: false

# The scan builds and contract-tests generator/Dockerfile, then stores its
# resolved immutable image identity internally. After teams are accepted,
# trusted automation calls POST /api/edit/games/{id}/variants/generate.
variantMode: PerParticipation

# Receipt issuance needs a separately deployed verifier. This runnable example
# deliberately demonstrates variants only; see PROVENANCE.md for the opt-in.
solveReceiptMode: Disabled

# The shared file explains the provenance flow; generated content and hints are
# supplied by the immutable manifest returned from generator/generate.py.
provide: dist
