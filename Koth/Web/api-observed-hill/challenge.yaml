# This shared hill demonstrates RSCTF's signed API observer. The observer is
# deployed separately; its HMAC secret must never enter this challenge image.
name: "King of the Hill Demo: API Observer"
author: "rsctf documentation team"
description: |
  Obtain your current KotH token and claim the shared hill with:

      curl -X POST --data-urlencode "token=YOUR_TOKEN" http://HILL/claim

  A separately hosted trusted observer reads the current controller from the
  challenge protocol and reports only that exact capability to RSCTF. RSCTF
  still runs the checker, confirms stable control, and calculates all points.
type: KingOfTheHill
category: Web
disableBloodBonus: true

container:
  # Repository Bindings builds only ./src. The sibling observer/ directory and
  # its runtime secret are deliberately outside the attackable hill image.
  memoryLimit: 64
  cpuCount: 1
  exposePort: 8080

ad:
  allowEgress: false
