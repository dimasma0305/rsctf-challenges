# This shared hill demonstrates lifecycle-bound reporting from a managed target.
name: "King of the Hill Demo: Proof Arena"
author: "rsctf documentation team"
description: |
  This is a Leaderboard hill, not an exclusive boot2root hill. Every team can
  score during the same challenge-native wave.

  POST your current KotH token as JSON to `/start`. The response contains a
  one-use nonce. Find a counter whose SHA-256 digest of
  `nonce + ":" + counter` begins with four zero hexadecimal digits, then POST
  `{"sessionId":"...","counter":123}` to `/solve` before it expires.

  RSCTF independently normalizes verified activity plus the stable
  `proof-strength` and `solve-speed` objectives. A four-zero proof is valid; finding a
  fifth leading zero improves strength but takes time, so the two objective
  channels create a real trade-off. Each 30-second wave is independent, and a
  fresh valid proof is required to score it. Failed guesses do not award
  evidence or subtract points. RSCTF awards 95% from relative performance and
  5% to that wave's first-place Crown. Only one unique leader receives it; on
  an exact top-score tie, every tied team receives full relative-performance
  credit and no team receives the Crown. The managed target sends bounded
  native evidence, never points or raw bearer tokens.
type: KingOfTheHill
category: Web
disableBloodBonus: true

container:
  memoryLimit: 64
  cpuCount: 1
  exposePort: 8080

ad:
  # Managed reporting and challenge internet access require outbound networking.
  allowEgress: true
