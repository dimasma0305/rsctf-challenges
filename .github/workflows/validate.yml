name: Validate challenge repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scored_event:
        description: Run the hosted RSCTF event on a disposable Linux runner
        type: choice
        options: [skip, preflight, four-hours]
        default: skip
      platform_run:
        description: Successful CI run ID from dimasma0305/rsctf
        type: string

permissions:
  contents: read

concurrency:
  group: validate-challenges-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scored-event:
    if: github.event_name == 'workflow_dispatch' && inputs.scored_event != 'skip'
    runs-on: ubuntu-24.04
    timeout-minutes: 280
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify and install the tested platform binary
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.platform_run }}
        run: |
          set -euo pipefail
          [[ "$RUN" =~ ^[1-9][0-9]*$ ]]
          repo=repos/dimasma0305/rsctf
          gh api "$repo/actions/runs/$RUN" > "$RUNNER_TEMP/platform-run.json"
          jq -e '.conclusion == "success" and .path == ".github/workflows/ci.yml" and .head_repository.full_name == "dimasma0305/rsctf"' "$RUNNER_TEMP/platform-run.json" >/dev/null
          gh api "$repo/actions/runs/$RUN/artifacts?per_page=100" |
            jq -e '[.artifacts[] | select((.name|test("^ci-server-[0-9a-f]{40}$")) and (.expired|not))] | select(length==1) | first' > "$RUNNER_TEMP/candidate.json"
          artifact=$(jq -r '.id' "$RUNNER_TEMP/candidate.json")
          gh api "$repo/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/server.zip"
          digest=$(jq -er '.digest|select(test("^sha256:[0-9a-f]{64}$"))|ltrimstr("sha256:")' "$RUNNER_TEMP/candidate.json")
          echo "$digest  $RUNNER_TEMP/server.zip" | sha256sum --check --strict
          source_sha=$(unzip -p "$RUNNER_TEMP/server.zip" source-sha)
          test "ci-server-$source_sha" = "$(jq -r '.name' "$RUNNER_TEMP/candidate.json")"
          unzip -p "$RUNNER_TEMP/server.zip" rsctf > "$RUNNER_TEMP/rsctf"
          sudo install -m 0755 "$RUNNER_TEMP/rsctf" /usr/local/bin/rsctf-event
          echo "Testing platform CI run $RUN at $source_sha"
      - name: Install event runner dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iptables ipset wireguard-tools libpcap0.8t64 python3-psycopg
      - name: Run official scoring over personal WireGuard connections
        env:
          MODE: ${{ inputs.scored_event }}
        run: sudo /usr/bin/python3 tools/ad-patch-rehearsal/scored_event.py "$MODE" "$RUNNER_TEMP/event-result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: scored-event
          path: ${{ runner.temp }}/event-result.json
          if-no-files-found: ignore

  kubernetes-patch-storage:
    name: Rehearse Kubernetes team storage and rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Kind and exercise the hosted fixture
        run: |
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64 -o "$RUNNER_TEMP/kind"
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  $RUNNER_TEMP/kind" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/kind"
          PATH="$RUNNER_TEMP:$PATH" python3 tools/ad-patch-rehearsal/test_kubernetes.py

  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      container_matrix: ${{ steps.rsctf.outputs.container_matrix }}
      container_count: ${{ steps.rsctf.outputs.container_count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate manifests with rsctf
        id: rsctf
        uses: dimasma0305/rsctf@main

      - name: Exercise five teams across all five hosted patch fixtures
        run: |
          python3 tools/ad-patch-rehearsal/test_rehearsal.py
          python3 tools/ad-patch-rehearsal/test_docker.py --teams 5

      - name: Generate private rehearsal event
        run: |
          python3 tools/ad-patch-rehearsal/generate.py "$RUNNER_TEMP/patch-rehearsal"
          mv "$RUNNER_TEMP/patch-rehearsal/repository" rehearsal-event

      - name: Validate generated rehearsal manifests
        uses: dimasma0305/rsctf@main
        with:
          path: rehearsal-event

  containers:
    name: Build ${{ matrix.name }}
    needs: manifests
    if: needs.manifests.outputs.container_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifests.outputs.container_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build without pushing
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          push: false
          tags: rsctf-example/${{ matrix.tag }}:ci
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

      - name: Verify Docker health
        if: matrix.kind == 'service'
        shell: bash
        env:
          IMAGE: rsctf-example/${{ matrix.tag }}:ci
        run: |
          set -euo pipefail
          if [[ "$(docker image inspect "$IMAGE" --format '{{if .Config.Healthcheck}}present{{else}}missing{{end}}')" != present ]]; then
            echo "::error::Service image $IMAGE does not declare a Docker HEALTHCHECK."
            exit 1
          fi

          container_id="$(docker run \
            --detach \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges=true \
            --pids-limit 128 \
            --memory 256m \
            "$IMAGE")"
          cleanup() {
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in {1..60}; do
            state="$(docker inspect \
              --format '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' \
              "$container_id")"
            if [[ "$state" == 'running healthy' ]]; then
              exit 0
            fi
            if [[ "$state" == exited* || "$state" == dead* || "$state" == *' unhealthy' || "$state" == *' missing' ]]; then
              docker logs "$container_id"
              echo "::error::Service image $IMAGE failed its Docker health gate: $state"
              exit 1
            fi
            sleep 1
          done

          docker logs "$container_id"
          echo "::error::Service image $IMAGE did not become healthy within 60 seconds."
          exit 1

      - name: Verify managed A&D flag rotation
        if: matrix.context == 'challenges/AD/Pwn/attack-defense-service/src'
        shell: bash
        env:
          IMAGE: rsctf-example/${{ matrix.tag }}:ci
        run: |
          set -euo pipefail
          container_id="$(docker run \
            --detach \
            --user 10000:10000 \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges=true \
            --pids-limit 128 \
            --memory 256m \
            "$IMAGE")"
          cleanup() {
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker exec "$container_id" sh -ec 'test -w /app && test -w /app/app.py && test -w /flag'

          for _ in {1..60}; do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container_id")"
            if [[ "$health" == healthy ]]; then
              break
            fi
            if [[ "$health" == unhealthy || "$health" == missing ]]; then
              echo "::error::Managed A&D image failed before flag rotation: $health"
              exit 1
            fi
            sleep 1
          done
          if [[ "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" != healthy ]]; then
            echo "::error::Managed A&D image did not become healthy before flag rotation."
            exit 1
          fi

          rotate_and_read() {
            local expected="$1"
            local delivered
            local observed
            delivered="$(docker exec "$container_id" sh -c \
              'umask 022 && printf '\''%s\n'\'' "$1" > "${RSCTF_FLAG_FILE:-/flag}" && cat "${RSCTF_FLAG_FILE:-/flag}"' \
              rsctf-flag "$expected")"
            [[ "$delivered" == "$expected" ]]
            observed="$(docker exec "$container_id" python -c \
              'import socket; s=socket.create_connection(("127.0.0.1", 8080), 2); s.sendall(b"GET_FLAG\n"); print(s.makefile("rb").readline(513).decode().strip())')"
            [[ "$observed" == "$expected" ]]
          }

          rotate_and_read 'flag{11111111111111111111111111111111}'
          rotate_and_read 'flag{22222222222222222222222222222222}'
