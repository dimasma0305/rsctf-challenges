name: Validate challenge repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-challenges-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      container_matrix: ${{ steps.rsctf.outputs.container_matrix }}
      container_count: ${{ steps.rsctf.outputs.container_count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate manifests with rsctf
        id: rsctf
        uses: dimasma0305/rsctf@main

  containers:
    name: Build ${{ matrix.name }}
    needs: manifests
    if: needs.manifests.outputs.container_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifests.outputs.container_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build without pushing
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          push: false
          tags: rsctf-example/${{ matrix.tag }}:ci
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

      - name: Verify Docker health
        if: matrix.kind == 'service'
        shell: bash
        env:
          IMAGE: rsctf-example/${{ matrix.tag }}:ci
        run: |
          set -euo pipefail
          if [[ "$(docker image inspect "$IMAGE" --format '{{if .Config.Healthcheck}}present{{else}}missing{{end}}')" != present ]]; then
            echo "::error::Service image $IMAGE does not declare a Docker HEALTHCHECK."
            exit 1
          fi

          container_id="$(docker run \
            --detach \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges=true \
            --pids-limit 128 \
            --memory 256m \
            "$IMAGE")"
          cleanup() {
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in {1..60}; do
            state="$(docker inspect \
              --format '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' \
              "$container_id")"
            if [[ "$state" == 'running healthy' ]]; then
              exit 0
            fi
            if [[ "$state" == exited* || "$state" == dead* || "$state" == *' unhealthy' || "$state" == *' missing' ]]; then
              docker logs "$container_id"
              echo "::error::Service image $IMAGE failed its Docker health gate: $state"
              exit 1
            fi
            sleep 1
          done

          docker logs "$container_id"
          echo "::error::Service image $IMAGE did not become healthy within 60 seconds."
          exit 1
